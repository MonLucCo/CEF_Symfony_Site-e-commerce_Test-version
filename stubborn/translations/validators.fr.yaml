# ===========================
# VALIDATION : User
# ===========================
user:
  email:
    unique: "Cette adresse e-mail est déjà utilisée."
    not_blank: "Veuillez saisir un email."
    invalid: "Adresse email invalide."
    max_length: "L'email ne doit pas dépasser {{ limit }} caractères."

  name:

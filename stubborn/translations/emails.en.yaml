  signature: "The Stubborn team"
  summary:
    title: "Order Summary"
    product: "Product"
    size: "Size"
    quantity: "Quantity"
    price: "Unit Price"
    total: "Total"
    total_order: "Order Total : %total% €"
  timestamp: "Sent on : %timestamp%"
